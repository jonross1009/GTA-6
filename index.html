<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GTA VI Countdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Font for GTA-ish vibes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top, #1a0033, #000);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .glow-bg {
      position: absolute;
      width: 120%;
      height: 120%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.12), transparent 40%);
      filter: blur(40px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 35px 45px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 16px;
      box-shadow:
        0 0 25px rgba(255, 0, 128, 0.4),
        0 0 40px rgba(0, 255, 255, 0.2);
      max-width: 90%;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.8rem;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px #ff0080,
        0 0 20px #ff0080;
    }

    .timezone {
      font-size: 0.7rem;
      color: #aaa;
      margin-bottom: 25px;
    }

    .timer {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .box {
      background: rgba(20, 20, 20, 0.9);
      padding: 18px 22px;
      border-radius: 10px;
      min-width: 90px;
      box-shadow:
        0 0 12px rgba(0, 255, 255, 0.25);
    }

    .num {
      font-size: 2.1rem;
      font-weight: 700;
      color: #00ffff;
      text-shadow:
        0 0 8px rgba(0, 255, 255, 0.8);
    }

    .label {
      font-size: 0.7rem;
      color: #ff77bb;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .released {
      font-size: 2rem;
      text-shadow:
        0 0 15px #00ffff,
        0 0 30px #ff0080;
    }
  </style>
</head>
<body>

<div class="glow-bg"></div>

<div class="container">
  <h1>GTA VI RELEASES IN</h1>
  <div class="timezone" id="timezone"></div>

  <div class="timer">
    <div class="box">
      <div class="num" id="days">0</div>
      <div class="label">DAYS</div>
    </div>
    <div class="box">
      <div class="num" id="hours">0</div>
      <div class="label">HOURS</div>
    </div>
    <div class="box">
      <div class="num" id="minutes">0</div>
      <div class="label">MINUTES</div>
    </div>
    <div class="box">
      <div class="num" id="seconds">0</div>
      <div class="label">SECONDS</div>
    </div>
  </div>
</div>

<script>
  // GTA VI release date (midnight, local time)
  const releaseDate = new Date("2026-11-19T00:00:00");

  // Detect user's timezone
  const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById("timezone").textContent =
    `Your timezone: ${userTimeZone}`;

  function updateTimer() {
    const now = new Date();
    const diff = releaseDate - now;

    if (diff <= 0) {
      document.querySelector(".container").innerHTML =
        '<div class="released">GTA VI IS OUT 🎮</div>';
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>

</body>
</html>
